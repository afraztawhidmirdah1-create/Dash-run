<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Dash Run — Afraz Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080b;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.hidden{display:none!important}.panel{width:min(92vw,520px);padding:28px;border-radius:28px;background:linear-gradient(145deg,rgba(10,18,25,.82),rgba(7,10,15,.68));border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 70px rgba(0,0,0,.5);backdrop-filter:blur(16px);text-align:center}.title{font-size:clamp(44px,11vw,84px);line-height:.9;font-weight:950;letter-spacing:-.055em;text-shadow:0 5px 30px rgba(0,0,0,.7)}.studio{margin-top:10px;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:#b7c8d5}.buttons{display:grid;gap:13px;margin-top:30px}.btn{border:0;border-radius:17px;padding:16px 20px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#19a8ff,#1467e8);box-shadow:0 10px 28px rgba(20,103,232,.32);cursor:pointer}.btn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:none}.coins{position:absolute;top:18px;right:18px;padding:10px 15px;border-radius:99px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);font-weight:800}.hud{position:absolute;top:18px;left:18px;display:flex;gap:9px;align-items:center}.pill{padding:9px 12px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);font-weight:800}.shop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,5,8,.62);backdrop-filter:blur(12px)}.shopbox{width:min(94vw,720px);max-height:88vh;overflow:auto;padding:24px;border-radius:25px;background:#0a1118;border:1px solid rgba(255,255,255,.13)}.shophead{display:flex;align-items:center;justify-content:space-between}.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-top:18px}.skin{padding:15px;border-radius:18px;background:#101a23;border:1px solid rgba(255,255,255,.08);text-align:center}.preview{height:130px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),transparent 42%),linear-gradient(#142431,#091016);margin-bottom:10px}.skinbtn{width:100%;margin-top:8px;padding:10px;border:0;border-radius:12px;background:#1d8cff;color:white;font-weight:800}.small{font-size:12px;color:#aebbc5}.gameover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.38);backdrop-filter:blur(5px)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="home" class="screen"><div class="panel"><div class="title">DASH<br>RUN</div><div class="studio">Made by Afraz Studio</div><div class="buttons"><button class="btn" id="play">PLAY</button><button class="btn secondary" id="shopBtn">SHOP</button></div><div class="small" style="margin-top:20px">Collect coins • Dodge obstacles • Unlock skins</div></div></div>
<div id="shop" class="shop hidden"><div class="shopbox"><div class="shophead"><h2 style="margin:0">SKIN SHOP</h2><button class="btn secondary" id="closeShop" style="padding:9px 14px">Close</button></div><div style="margin-top:8px;color:#c9d4dc">Coins: <b id="shopCoins">0</b></div><div class="skins" id="skins"></div></div></div>
<div id="hud" class="hidden"><div class="hud"><div class="pill">🏃 <span id="score">0</span></div><div class="pill">🪙 <span id="runCoins">0</span></div></div><div class="coins">🪙 <span id="totalCoins">0</span></div></div>
<div id="gameover" class="gameover hidden"><div class="panel"><h1 style="margin:0 0 8px">RUN OVER</h1><div style="font-size:22px">Score: <b id="finalScore">0</b></div><div style="margin-top:7px">Coins collected: <b id="finalCoins">0</b></div><div class="buttons"><button class="btn" id="again">RUN AGAIN</button><button class="btn secondary" id="homeBtn">HOME</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr,raf,last=0,playing=false,score=0,runCoins=0,totalCoins=Number(localStorage.drCoins||0),lane=1,targetLane=1,y=0,vy=0,jumping=false,speed=0.48,spawn=0,objects=[],skin=localStorage.drSkin||'runner';
const skins=[{id:'runner',name:'Street Runner',cost:0,body:'#dce8ef',accent:'#263d4c'},{id:'neon',name:'Neon Pulse',cost:75,body:'#35e7ff',accent:'#0c5cff'},{id:'sunset',name:'Sunset',cost:150,body:'#ffb36b',accent:'#d44825'},{id:'forest',name:'Forest',cost:250,body:'#9fda8a',accent:'#1b633d'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function money(){document.getElementById('totalCoins').textContent=totalCoins;document.getElementById('shopCoins').textContent=totalCoins}
function home(){playing=false;document.getElementById('home').classList.remove('hidden');document.getElementById('hud').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');document.getElementById('shop').classList.add('hidden');money()}
function start(){document.getElementById('home').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');score=0;runCoins=0;lane=1;targetLane=1;y=0;vy=0;jumping=false;speed=.48;objects=[];playing=true;last=performance.now();requestAnimationFrame(loop)}
function roadY(){return H*.67}function horizon(){return H*.33}function laneX(l,depth=1){const center=W/2;const roadW=W*(.16+.72*depth);return center+(l-1)*roadW*.28}function depthY(z){return horizon()+(roadY()-horizon())*(1-z)}
function drawWorld(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8ab6c9');g.addColorStop(.38,'#cfe0d1');g.addColorStop(.7,'#597a45');g.addColorStop(1,'#10170e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant mountains
 ctx.fillStyle='rgba(50,75,65,.72)';ctx.beginPath();ctx.moveTo(0,horizon()+50);for(let x=0;x<=W;x+=70)ctx.lineTo(x,horizon()+15+35*Math.sin(x*.012));ctx.lineTo(W,horizon()+110);ctx.lineTo(0,horizon()+110);ctx.fill();
 // trees
 for(let i=0;i<18;i++){let x=(i*97+(t*.015*(i%2?1:-1)))% (W+180)-90;let base=horizon()+70+(i%4)*17;let s=18+(i%5)*8;ctx.fillStyle='#294d32';ctx.fillRect(x-3,base-s*.2,6,s*.9);ctx.beginPath();ctx.arc(x,base-s*.65,s,0,Math.PI*2);ctx.fill()}
 // road trapezoid
 ctx.fillStyle='#252b2f';ctx.beginPath();ctx.moveTo(W*.44,horizon());ctx.lineTo(W*.56,horizon());ctx.lineTo(W*.98,H);ctx.lineTo(W*.02,H);ctx.closePath();ctx.fill();
 // road highlights
 for(let i=0;i<18;i++){let z=((i/18)+(t*.00025))%1;let yy=depthY(1-z);let half=W*(.06+.43*(1-z));ctx.strokeStyle=`rgba(255,255,255,${.03+.07*(1-z)})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-half,yy);ctx.lineTo(W/2+half,yy);ctx.stroke()}
 // lane markers
 for(let l of [.5,1.5){ctx.strokeStyle='rgba(220,230,232,.58)';ctx.lineWidth=2;ctx.setLineDash([16,20]);ctx.beginPath();ctx.moveTo(W/2+(l-1)*W*.08,horizon());ctx.lineTo(W/2+(l-1)*W*.47,H);ctx.stroke()}ctx.setLineDash([]);
}
function drawCharacter(){const s=1+Math.min(y/220,0);const x=laneX(lane,1), base=roadY()-y;const sk=skins.find(q=>q.id===skin)||skins[0];ctx.save();ctx.translate(x,base);ctx.scale(.9+s*.1,.9+s*.1);ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=18;ctx.shadowOffsetY=12;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,8,32,9,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';
 ctx.fillStyle=sk.body;ctx.beginPath();ctx.roundRect(-17,-75,34,47,11);ctx.fill();ctx.fillStyle=sk.accent;ctx.fillRect(-16,-43,32,13);ctx.beginPath();ctx.arc(0,-91,17,0,Math.PI*2);ctx.fillStyle=sk.body;ctx.fill();ctx.fillStyle='#202a31';ctx.beginPath();ctx.arc(0,-96,17,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle=sk.accent;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-15,-30);ctx.lineTo(-22,-4);ctx.moveTo(15,-30);ctx.lineTo(22,-4);ctx.stroke();ctx.strokeStyle=sk.body;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-10,-4);ctx.lineTo(-17,15);ctx.moveTo(10,-4);ctx.lineTo(17,15);ctx.stroke();ctx.restore()}
function drawObject(o){const z=o.z, yy=depthY(z), x=laneX(o.lane,z), scale=.18+1.05*(1-z);ctx.save();ctx.translate(x,yy);ctx.scale(scale,scale);if(o.type==='coin'){ctx.rotate(performance.now()*.004);ctx.shadowColor='#ffd95a';ctx.shadowBlur=18;ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.ellipse(0,0,13,17,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#fff1a1';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('D',0,5)}else{ctx.fillStyle='#59656c';ctx.beginPath();ctx.roundRect(-22,-28,44,42,5);ctx.fill();ctx.fillStyle='#d74b35';ctx.fillRect(-18,-23,36,7);ctx.fillStyle='#263136';ctx.fillRect(-17,-8,34,15)}ctx.restore()}
function spawnObj(){const lane=Math.floor(Math.random()*3);objects.push({lane,z:0,type:Math.random()<.55?'coin':'block'})}
function loop(now){if(!playing)return;const dt=Math.min(32,now-last);last=now;score+=dt*.02;speed=Math.min(.82,speed+dt*.000005);spawn-=dt;if(spawn<=0){spawnObj();spawn=520-Math.min(260,score*.35)}lane+=(targetLane-lane)*.16;if(jumping){vy-=.0015*dt;y+=vy*dt;if(y<=0){y=0;vy=0;jumping=false}}
 objects.forEach(o=>o.z+=speed*dt*.001);for(let i=objects.length-1;i>=0;i--){let o=objects[i];if(o.z>1.02){objects.splice(i,1);continue}if(o.z>.91&&o.z<1.01&&Math.abs(o.lane-Math.round(lane))<.38){if(o.type==='coin'){totalCoins++;runCoins++;objects.splice(i,1);money()}else if(y<55){end()}}}
 drawWorld(now);objects.slice().sort((a,b)=>a.z-b.z).forEach(drawObject);drawCharacter();document.getElementById('score').textContent=Math.floor(score);document.getElementById('runCoins').textContent=runCoins;requestAnimationFrame(loop)}
function end(){playing=false;localStorage.drCoins=totalCoins;document.getElementById('finalScore').textContent=Math.floor(score);document.getElementById('finalCoins').textContent=runCoins;document.getElementById('gameover').classList.remove('hidden');document.getElementById('hud').classList.add('hidden')}
function jump(){if(playing&&!jumping){jumping=true;vy=.58}}
function move(dir){targetLane=Math.max(0,Math.min(2,targetLane+dir))}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')jump()});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<30)jump();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump()},{passive:true});
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('homeBtn').onclick=home;document.getElementById('shopBtn').onclick=()=>{renderShop();document.getElementById('shop').classList.remove('hidden');document.getElementById('home').classList.add('hidden')};document.getElementById('closeShop').onclick=()=>{document.getElementById('shop').classList.add('hidden');document.getElementById('home').classList.remove('hidden')};
function renderShop(){money();const el=document.getElementById('skins');el.innerHTML='';skins.forEach(s=>{const owned=s.cost===0||localStorage.getItem('drOwned_'+s.id)==='1';const div=document.createElement('div');div.className='skin';div.innerHTML=`<div class="preview"><div style="width:42px;height:92px;border-radius:22px 22px 13px 13px;background:${s.body};border:8px solid ${s.accent};box-shadow:0 12px 25px #0008"></div></div><b>${s.name}</b><div class="small">${s.cost?('🪙 '+s.cost):'Free'}</div><button class="skinbtn">${owned?(skin===s.id?'EQUIPPED':'EQUIP'):'BUY'}</button>`;div.querySelector('button').onclick=()=>{if(!owned){if(totalCoins<s.cost){alert('Not enough coins yet.');return}totalCoins-=s.cost;localStorage.drCoins=totalCoins;localStorage.setItem('drOwned_'+s.id,'1')}skin=s.id;localStorage.drSkin=skin;renderShop()};el.appendChild(div)})}
for(const s of skins)if(s.cost===0)localStorage.setItem('drOwned_'+s.id,'1');money();
</script></body></html>
